[profile.default]
via_ir = true
optimizer = true
optimizer_runs = 200
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
fs_permissions = [{ access = "read", path = "./"}]

[fmt]
# forge fmt once split one-line blocks in this file and changed its meaning: keep it out
ignore = ["src/NightwireEngine.sol"]
